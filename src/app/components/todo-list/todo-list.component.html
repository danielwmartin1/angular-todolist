<ul class="todo-list scrollable">
  <app-todo-item *ngFor="let todo of todos" [todo]="todo" (toggleTodoCompletion)="toggleTodoCompletion.emit($event)" (editTodoText)="editTodoText.emit($event)" (exitEdit)="exitEdit.emit($event)" (cancelEdit)="cancelEdit.emit($event)" (updateTodoText)="updateTodoText.emit($event)" (removeTodo)="removeTodo.emit($event)" (preventBlur)="preventBlur.emit($event)"></app-todo-item>
</ul>
